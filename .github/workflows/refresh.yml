name: Refresh schedule data

on:
  schedule:
    - cron: '0 6 1 1 *'   # Jan 1 at 06:00 UTC
    - cron: '0 6 1 7 *'   # Jul 1 at 06:00 UTC
  workflow_dispatch:        # manual trigger from Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run refresh script
        run: python refresh_data.py

      - name: Commit updated index.html
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "chore: refresh parasha and holiday schedule data"
          git push
